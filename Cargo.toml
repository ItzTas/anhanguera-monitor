[package]
name = "anhanguera-monitor"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "anhanguera_monitor"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "=0.4.45", default-features = false, features = ["now"] }
chrono-tz = { version = "=0.10.4", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
monitor-hub-sdk = { git = "https://github.com/ItzTas/monitor-hub", tag = "sdk-rust/v0.4.0" }
prost-types = "0.14.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "http2", "rustls"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "runtime-tokio", "sqlx-postgres", "with-chrono"] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = ["runtime-tokio", "sqlx-postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14.8", default-features = false, features = ["codegen"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
unicode-normalization = "=0.1.25"
webpki-root-certs = "1.0.11"
zeroize = "1.9.1"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
monitor-hub-sdk-testkit = { git = "https://github.com/ItzTas/monitor-hub", tag = "sdk-rust/v0.4.0" }
tokio = { version = "1.54.1", features = ["macros", "net", "rt"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
tonic = { version = "0.14.8", default-features = false, features = ["channel"] }
tonic-prost = { version = "0.14.8", default-features = false }
