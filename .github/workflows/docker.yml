name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: anhanguera_monitor
          POSTGRES_USER: anhanguera_monitor
          POSTGRES_PASSWORD: anhanguera_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anhanguera_monitor -d anhanguera_monitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://anhanguera_monitor:anhanguera_monitor@localhost:5432/anhanguera_monitor?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
          cache: false

      - name: Install the conformance command
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/ItzTas/monitor-hub/sdk-go/cmd/monitor-conformance@v0.7.0
          echo "MONITOR_CONFORMANCE=$RUNNER_TEMP/bin/monitor-conformance" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2.9.3

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked

  release:
    name: Tag the release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: false
          custom_release_rules: chore:patch,refactor:patch,build:patch
          create_annotated_tag: true

      - if: steps.tag.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.new_tag }}
          NOTES: ${{ steps.tag.outputs.changelog }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$NOTES"

  image:
    name: Build and publish the image
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,priority=300

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
